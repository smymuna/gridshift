[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gridshift"
version = "0.1.0"
description = "Carbon-aware job scheduling for European power grids"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Mymuna Sultana" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
gridshift = "gridshift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["gridshift"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
