name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, type-check, test and build every workspace (Python API, API client, Next.js app)
  # through Turborepo, the same commands as `npm run check` locally.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck test build --ui=stream
      - name: API contract is up to date (openapi.json and generated types)
        run: |
          npm run openapi
          git diff --exit-code -- packages/api-client || {
            echo "::error::Run 'npm run openapi' and commit the regenerated API client"; exit 1; }

  api-python-3-13:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t gridshift-api:ci apps/api
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 gridshift-api:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
